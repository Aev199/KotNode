name: KotNode AutoCAD 2021 regression and plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build managed AutoCAD 2021 plugin and run core tests
        shell: pwsh
        run: ./build.ps1
      - name: Verify plugin package
        shell: pwsh
        run: |
          $required = 'KotNode.AutoCAD.dll','KotNode.Core.dll'
          foreach ($name in $required) {
            $file = Get-Item (Join-Path plugin $name) -ErrorAction Stop
            if ($file.Length -lt 1024) { throw "Invalid binary: $name" }
            Write-Host "$name : $($file.Length) bytes"
          }
          if (Test-Path plugin/KotNode.HlrBridge.dll) { throw 'Disabled experimental HLR bridge must not enter Flatshot package.' }
          Get-ChildItem plugin -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content plugin/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KotNode-AutoCAD2021-parametric-prototype
          path: plugin/
          if-no-files-found: error
          retention-days: 7
