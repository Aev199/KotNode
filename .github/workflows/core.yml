name: Core regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/KotNode.Tests.csproj -c Release
      - run: dotnet build src/Core/KotNode.Core.csproj -c Release -f net48
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build AutoCAD 2021 plugin and run core checks
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: KotNode-AutoCAD2021-experimental
          path: plugin/
          if-no-files-found: error
          retention-days: 7
